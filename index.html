<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Astro Dash: Hardcore Edition</title>
    <style>
        body { margin: 0; overflow: hidden; background: #020205; font-family: 'Segoe UI', sans-serif; color: white; }
        canvas { display: block; }
        #ui {
            position: absolute; top: 30px; left: 30px;
            background: rgba(10, 10, 25, 0.8);
            padding: 20px; border-radius: 15px;
            border: 2px solid #00f2ff;
            box-shadow: 0 0 15px rgba(0, 242, 255, 0.4);
            pointer-events: none;
        }
        .stat { font-size: 12px; text-transform: uppercase; letter-spacing: 3px; color: #00f2ff; opacity: 0.8; }
        .value { font-size: 32px; font-weight: 900; font-family: 'Courier New', monospace; text-shadow: 0 0 10px #00f2ff; }
        #best-box { margin-top: 10px; font-size: 14px; color: #ffcc00; }
    </style>
</head>
<body>
    <div id="ui">
        <div class="stat">Distance</div>
        <div id="dist" class="value">0000</div>
        <div id="best-box">BEST: <span id="best">0</span></div>
    </div>
    <canvas id="gameCanvas"></canvas>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const distElement = document.getElementById('dist');
const bestElement = document.getElementById('best');

let canvasW, canvasH, isPlaying = true, distance = 0, frames = 0;
let highScore = localStorage.getItem('astroBest') || 0;
bestElement.innerText = highScore;

const GRAVITY = 0.24;
const THRUST = -0.65;
const FRICTION = 0.98;

const player = {
    x: 150, y: 300, vy: 0, 
    width: 45, height: 60,
    isThrusting: false,
    tilt: 0
};

let asteroids = [];
let stars = Array.from({length: 120}, () => ({
    x: Math.random() * window.innerWidth,
    y: Math.random() * window.innerHeight,
    size: Math.random() * 2.5,
    speed: Math.random() * 0.5 + 0.1
}));

function resize() {
    canvasW = canvas.width = window.innerWidth;
    canvasH = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

const setThrust = (val) => player.isThrusting = val;
window.addEventListener('keydown', (e) => { if(e.code === 'Space') setThrust(true); });
window.addEventListener('keyup', (e) => { if(e.code === 'Space') setThrust(false); });
window.addEventListener('mousedown', () => setThrust(true));
window.addEventListener('mouseup', () => setThrust(false));

function spawnAsteroid() {
    const size = Math.random() * 60 + 35;
    // Spawn off-screen to prevent flashing
    asteroids.push({
        x: canvasW + size + 50, 
        y: Math.random() * (canvasH - size),
        size: size,
        speed: Math.random() * 2 + 4 + (distance / 800),
        rot: Math.random() * Math.PI * 2,
        rotV: (Math.random() - 0.5) * 0.04,
        // Pre-calculating shape to prevent mid-game calculation lag
        points: Array.from({length: 8}, () => 0.8 + Math.random() * 0.4)
    });
}

function drawAstronaut(ctx) {
    ctx.save();
    ctx.translate(player.x + player.width / 2, player.y + player.height / 2);
    
    let targetTilt = player.isThrusting ? 0.25 : -0.1;
    player.tilt += (targetTilt - player.tilt) * 0.1;
    ctx.rotate(player.tilt);

    if (player.isThrusting) {
        ctx.beginPath();
        let flameH = 25 + Math.random() * 25;
        let grad = ctx.createLinearGradient(0, 20, 0, 20 + flameH);
        grad.addColorStop(0, '#00f2ff');
        grad.addColorStop(0.5, '#ffaa00');
        grad.addColorStop(1, 'transparent');
        ctx.fillStyle = grad;
        ctx.ellipse(-12, 25, 6, flameH, 0, 0, Math.PI * 2);
        ctx.ellipse(-5, 22, 4, flameH * 0.7, 0, 0, Math.PI * 2);
        ctx.fill();
    }

    ctx.fillStyle = '#bcbcbc';
    ctx.roundRect(-25, -10, 15, 35, 5);
    ctx.fill();

    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.roundRect(-15, -20, 30, 45, 10);
    ctx.fill();
    
    ctx.fillStyle = '#e0e0e0';
    ctx.fillRect(-8, -5, 16, 10);
    ctx.fillStyle = '#ff3300';
    ctx.fillRect(-5, -2, 4, 4);

    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(5, -22, 18, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#1a1a1a';
    ctx.beginPath();
    ctx.roundRect(-2, -32, 22, 18, [5, 12, 12, 5]);
    ctx.fill();

    ctx.strokeStyle = 'rgba(255,255,255,0.2)';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(10, -25, 8, -1, 0);
    ctx.stroke();

    ctx.restore();
}

function update() {
    if (!isPlaying) return;

    player.vy = player.isThrusting ? player.vy + THRUST : player.vy + GRAVITY;
    player.vy *= FRICTION;
    player.y += player.vy;

    // DEATH CONDITION: Touching bottom
    if (player.y + player.height > canvasH) {
        gameOver("CRASH LANDING: You hit the surface!");
    }
    
    // Ceiling Bounce
    if (player.y < 0) { 
        player.y = 0; 
        player.vy *= -0.5; 
    }

    if (frames % 50 === 0) spawnAsteroid();
    
    asteroids.forEach((ast, i) => {
        ast.x -= ast.speed;
        ast.rot += ast.rotV;

        let cx = Math.max(player.x, Math.min(ast.x, player.x + player.width));
        let cy = Math.max(player.y, Math.min(ast.y, player.y + player.height));
        let dx = ast.x - cx, dy = ast.y - cy;

        if ((dx*dx + dy*dy) < (ast.size/2.3 * ast.size/2.3)) {
            gameOver("HULL BREACH: Asteroid impact!");
        }
        if (ast.x + ast.size < -100) asteroids.splice(i, 1);
    });

    distance += 0.2;
    distElement.innerText = Math.floor(distance).toString().padStart(4, '0');
    frames++;
}

function draw() {
    ctx.fillStyle = '#050510';
    ctx.fillRect(0, 0, canvasW, canvasH);

    stars.forEach(s => {
        s.x -= s.speed;
        if(s.x < 0) s.x = canvasW;
        ctx.globalAlpha = s.speed;
        ctx.fillStyle = "white";
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.size/2, 0, Math.PI*2);
        ctx.fill();
    });
    ctx.globalAlpha = 1;

    asteroids.forEach(ast => {
        ctx.save();
        ctx.translate(ast.x, ast.y);
        ctx.rotate(ast.rot);
        ctx.fillStyle = '#3a3a45';
        ctx.beginPath();
        ast.points.forEach((p, i) => {
            let angle = (i/ast.points.length) * Math.PI * 2;
            let r = (ast.size/2) * p;
            ctx.lineTo(Math.cos(angle)*r, Math.sin(angle)*r);
        });
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = '#222';
        ctx.stroke();
        ctx.restore();
    });

    drawAstronaut(ctx);

    requestAnimationFrame(() => {
        update();
        draw();
    });
}

function gameOver(reason) {
    isPlaying = false;
    if (distance > highScore) {
        localStorage.setItem('astroBest', Math.floor(distance));
        alert(reason + "\n\nNEW RECORD: " + Math.floor(distance));
    } else {
        alert(reason + "\n\nDistance: " + Math.floor(distance));
    }
    location.reload();
}

draw();
</script>
</body>
</html>
